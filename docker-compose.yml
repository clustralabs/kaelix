services:
  postgres:
    image: postgres:16-alpine
    container_name: kaelix-db
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kaelix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kaelix}
      POSTGRES_DB: ${POSTGRES_DB:-kaelix}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kaelix} -d ${POSTGRES_DB:-kaelix}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - kaelix-net

  backend:
    build:
      context: ./Rust
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-kaelix}:${POSTGRES_PASSWORD:-kaelix}@postgres:5432/${POSTGRES_DB:-kaelix}
      RUST_LOG: ${RUST_LOG:-kaelix=info,tower_http=info}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8000/up || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - kaelix-net

  frontend:
    build:
      context: ./JS
      args:
        API_URL: http://backend:8000
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      API_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - kaelix-net

  redis:
    image: redis:7-alpine
    container_name: kaelix-cache
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - kaelix-net

volumes:
  postgres_data:
  redis_data:

networks:
  kaelix-net:
    name: kaelix-net
    driver: bridge
